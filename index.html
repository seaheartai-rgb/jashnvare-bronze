<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتایج نهایی پانزدهمین جشنواره فروش بیمه‌های زندگی | گروه برنز</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>
:root {
  --green-dark: #5a6b4d;
  --green-mid: #7a8a6c;
  --green-light: #9aab8c;
  --gold-main: #c9a961;
  --gold-light: #e0c586;
  --gold-dark: #a88840;
  --cream: #f7f3e8;
  --text-dark: #3a4a2e;
  --text-mid: #5a6b4d;
  --peach-bg: #ffe8d1;
  --red-accent: #c0392b;
  --shadow-soft: 0 4px 20px rgba(90, 107, 77, 0.15);
  --shadow-strong: 0 15px 40px rgba(90, 107, 77, 0.25);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  direction: rtl;
  text-align: right;
  background: #f0ede5;
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============================================================
   مدیریت صفحه‌ها
   ============================================================ */
.screen {
  display: none;
  min-height: 100vh;
  width: 100%;
  position: relative;
}

.screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

/* ============================================================
   صفحه اول: پاکت
   ============================================================ */
#envelope-screen {
  background-image: url('assets/background.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  padding: 0;
  position: relative;
  overflow: hidden;
}

#envelope-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(255, 255, 255, 0.4) 0%,
    rgba(255, 255, 255, 0.15) 50%,
    rgba(255, 255, 255, 0.3) 100%
  );
  pointer-events: none;
  z-index: 1;
}

.envelope-page-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  min-height: 100vh;
  width: 100%;
  padding: 3vh 20px 3vh;
}

/* ⭐ لوگو در بالای صفحه */
.company-logo-top {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  animation: fadeInDown 1s ease backwards;
  flex-shrink: 0;
}

.company-logo-top img {
  max-width: 260px;
  width: 60%;
  height: auto;
  filter: drop-shadow(0 4px 12px rgba(90, 107, 77, 0.2));
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ⭐ متن عنوان در کادر نارنجی پاستیلی */
.festival-title {
  text-align: center;
  padding: 12px 24px;
  animation: fadeInDown 1s ease 0.2s backwards;
  background: var(--peach-bg);
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(90, 107, 77, 0.1);
  max-width: 90%;
  flex-shrink: 0;
}

.festival-title h1 {
  font-size: 24px;
  font-weight: 800;
  color: var(--green-dark);
  margin-bottom: 2px;
  line-height: 1.5;
  text-shadow: none;
  letter-spacing: -0.5px;
}

.festival-title h1 .red-text {
  color: var(--red-accent);
}

.festival-title h1 span {
  display: block;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-mid);
  margin-top: 4px;
}

.title-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 8px auto 0;
  max-width: 220px;
}

.title-divider::before,
.title-divider::after {
  content: '';
  flex: 1;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
}

.title-divider span {
  color: var(--gold-main);
  font-size: 14px;
  letter-spacing: 6px;
}

/* ⭐ پاکت در وسط صفحه */
.envelope-wrapper {
  position: relative;
  max-width: 420px;
  width: 80%;
  cursor: pointer;
  perspective: 1500px;
  transform-style: preserve-3d;
  animation: floatEnvelope 4s ease-in-out infinite;
  animation-delay: 0.4s;
  flex-shrink: 0;
}

@keyframes floatEnvelope {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.envelope-wrapper:hover {
  animation-play-state: paused;
}

.envelope-wrapper:active {
  transform: scale(0.97);
}

.envelope-image-container {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 
    0 25px 60px rgba(90, 107, 77, 0.3),
    0 0 0 1px rgba(201, 169, 97, 0.2);
  transition: all 0.5s ease;
  background: #7a8a6c;
}

.envelope-wrapper:hover .envelope-image-container {
  box-shadow: 
    0 30px 70px rgba(90, 107, 77, 0.4),
    0 0 0 3px rgba(201, 169, 97, 0.4);
  transform: translateY(-5px);
}

.envelope-image {
  width: 100%;
  height: auto;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

/* ⭐ متن راهنما زیر پاکت */
.envelope-hint {
  position: relative;
  background: rgba(255, 255, 255, 0.95);
  color: var(--text-mid);
  padding: 10px 25px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-soft);
  white-space: nowrap;
  animation: pulseHint 2.2s ease-in-out infinite;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(201, 169, 97, 0.3);
  flex-shrink: 0;
}

@keyframes pulseHint {
  0%, 100% { opacity: 0.85; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-5px); }
}

/* انیمیشن باز شدن */
.envelope-wrapper.opening {
  animation: openAnimation 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  pointer-events: none;
}

@keyframes openAnimation {
  0% { transform: scale(1) translateY(0) rotateX(0deg); opacity: 1; }
  30% { transform: scale(1.05) translateY(-20px) rotateX(-10deg); opacity: 1; }
  60% { transform: scale(1.15) translateY(-40px) rotateX(-25deg); opacity: 0.8; }
  100% { transform: scale(1.4) translateY(-80px) rotateX(-45deg); opacity: 0; }
}

.envelope-wrapper.opening ~ .envelope-hint {
  opacity: 0;
  transition: opacity 0.3s;
}

/* ============================================================
   صفحه دوم: نتایج
   ============================================================ */
#winners-screen {
  background-color: #faf7f0;
  background-image: 
    linear-gradient(180deg, #f7f3e8 0%, #faf7f0 100%);
  padding: 0;
  align-items: flex-start;
  overflow-y: auto;
}

.letter-open-decoration {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px 20px 0;
  margin-bottom: -20px;
  position: relative;
}

.letter-open-decoration img {
  max-width: 650px;
  width: 90%;
  height: auto;
  display: block;
  filter: drop-shadow(0 8px 25px rgba(90, 107, 77, 0.15));
}

.winners-page-content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 30px 40px 60px;
  flex: 1;
}

.company-logo-top-winners {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 0 25px;
  animation: fadeInDown 0.8s ease;
}

.company-logo-top-winners img {
  max-width: 280px;
  width: 60%;
  height: auto;
  filter: drop-shadow(0 4px 12px rgba(90, 107, 77, 0.15));
}

.letter-header {
  text-align: center;
  margin-bottom: 30px;
  padding: 10px 20px;
}

.letter-title {
  font-size: 38px;
  font-weight: 800;
  color: var(--text-dark);
  margin-bottom: 10px;
  letter-spacing: -0.5px;
  text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
}

.letter-subtitle {
  font-size: 17px;
  color: var(--text-mid);
  font-weight: 500;
  margin-bottom: 6px;
  text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
}

.letter-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin: 22px auto;
  max-width: 280px;
}

.letter-divider::before,
.letter-divider::after {
  content: '';
  flex: 1;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
}

.letter-divider span {
  color: var(--gold-main);
  font-size: 18px;
  letter-spacing: 8px;
}

.letter-count {
  display: inline-block;
  background: rgba(255, 255, 255, 0.9);
  color: var(--green-dark);
  padding: 8px 24px;
  border-radius: 20px;
  font-size: 15px;
  font-weight: 600;
  box-shadow: var(--shadow-soft);
  border: 1.5px solid var(--gold-light);
}

.letter-count strong {
  color: var(--gold-dark);
  font-size: 20px;
  margin: 0 4px;
}

.winners-table-wrapper {
  position: relative;
  z-index: 2;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(6px);
  border-radius: 16px;
  box-shadow: 
    0 10px 40px rgba(90, 107, 77, 0.12),
    0 0 0 1px rgba(201, 169, 97, 0.25);
  overflow: hidden;
  border: 1px solid rgba(201, 169, 97, 0.3);
}

.winners-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.winners-table thead th {
  background: linear-gradient(180deg, var(--green-dark) 0%, var(--green-mid) 100%);
  color: var(--cream);
  padding: 18px 14px;
  font-size: 15px;
  font-weight: 700;
  text-align: right;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

.winners-table thead th:first-child {
  border-top-right-radius: 16px;
  text-align: center;
}

.winners-table thead th:last-child {
  border-top-left-radius: 16px;
}

.winners-table th.col-rank { width: 90px; text-align: center; }
.winners-table th.col-name { width: auto; }
.winners-table th.col-code { width: 130px; }
.winners-table th.col-branch { width: 200px; }

.winners-table tbody tr {
  background: rgba(255, 255, 255, 0.5);
  transition: all 0.5s ease;
  opacity: 0;
  transform: translateY(20px);
}

.winners-table tbody tr.revealed {
  opacity: 1;
  transform: translateY(0);
}

.winners-table tbody tr:nth-child(even) {
  background: rgba(122, 138, 108, 0.06);
}

.winners-table tbody tr:hover {
  background: rgba(201, 169, 97, 0.15);
}

.winners-table td {
  padding: 15px 14px;
  font-size: 15px;
  color: var(--text-dark);
  border-bottom: 1px solid rgba(201, 169, 97, 0.15);
  vertical-align: middle;
}

.winners-table tbody tr:last-child td {
  border-bottom: none;
}

.winners-table td.col-rank {
  text-align: center;
  color: var(--green-dark);
  font-weight: 700;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}

.winners-table td.col-name {
  font-weight: 600;
  color: var(--text-dark);
}

.winners-table td.col-code {
  color: var(--text-mid);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.5px;
}

.winners-table td.col-branch {
  color: var(--text-mid);
}

.winners-table tbody tr:nth-child(1) {
  background: linear-gradient(90deg, rgba(201, 169, 97, 0.22) 0%, rgba(255, 255, 255, 0.6) 100%);
}

.winners-table tbody tr:nth-child(2),
.winners-table tbody tr:nth-child(3) {
  background: linear-gradient(90deg, rgba(201, 169, 97, 0.12) 0%, rgba(255, 255, 255, 0.5) 100%);
}

.winners-table tbody tr:nth-child(1) td.col-rank,
.winners-table tbody tr:nth-child(2) td.col-rank,
.winners-table tbody tr:nth-child(3) td.col-rank {
  color: var(--gold-dark);
  font-size: 19px;
  text-shadow: 0 0 8px rgba(201, 169, 97, 0.4);
}

.back-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.95);
  color: var(--green-dark);
  border: 2px solid var(--green-dark);
  padding: 10px 22px;
  border-radius: 30px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.back-btn:hover {
  background: var(--green-dark);
  color: var(--cream);
  transform: translateY(-2px);
  box-shadow: var(--shadow-strong);
}

/* ============================================================
   موبایل - کاهش شدیدتر فواصل + نزدیک‌تر شدن متن راهنما به پاکت
   ============================================================ */
@media (max-width: 768px) {
  .envelope-page-content {
    /* ⭐ پدینگ عمودی تقریباً صفر */
    padding: 0.5vh 15px 0.5vh;
    justify-content: space-between;
    gap: 0;
  }

  /* ⭐ لوگو با فاصله منفی از بالا */
  .company-logo-top {
    margin-top: -25px;
    margin-bottom: -20px;
  }

  /* ⭐ متن عنوان با فاصله منفی از لوگو و پاکت */
  .festival-title {
    margin-top: -25px;
    margin-bottom: -20px;
  }

  /* ⭐ پاکت با فاصله منفی از متن عنوان */
  .envelope-wrapper { 
    margin-top: -30px;
    margin-bottom: 0; /* حذف فاصله پایین پاکت */
  }

  /* ⭐ متن راهنما چسبیده به پاکت (نزدیک‌تر از بقیه فواصل) */
  .envelope-hint { 
    margin-top: -35px; /* نزدیک‌تر از بقیه فواصل */
    margin-bottom: 0;
  }

  .letter-open-decoration {
    padding: 20px 15px 0;
    margin-bottom: -10px;
  }

  .letter-open-decoration img {
    max-width: 380px;
    width: 95%;
  }

  .winners-page-content { padding: 20px 15px 50px; }

  .company-logo-top-winners img {
    max-width: 220px;
    width: 65%;
  }

  .letter-title { font-size: 26px; }
  .letter-subtitle { font-size: 14px; }
  .letter-count { font-size: 13px; padding: 6px 16px; }
  .letter-count strong { font-size: 16px; }

  .back-btn {
    top: 12px;
    right: 12px;
    padding: 8px 16px;
    font-size: 12px;
  }

  .winners-table th.col-rank { width: 55px; }
  .winners-table th.col-code { width: 80px; }
  .winners-table th.col-branch { width: 115px; }

  .winners-table thead th { padding: 12px 6px; font-size: 11px; }
  .winners-table td { padding: 10px 6px; font-size: 12px; }
  .winners-table td.col-rank { font-size: 13px; }

  .winners-table tbody tr:nth-child(1) td.col-rank,
  .winners-table tbody tr:nth-child(2) td.col-rank,
  .winners-table tbody tr:nth-child(3) td.col-rank {
    font-size: 15px;
  }
}

@media (max-width: 400px) {
  .company-logo-top {
    margin-top: -20px;
    margin-bottom: -15px;
  }

  .festival-title {
    margin-top: -20px;
    margin-bottom: -15px;
  }

  .envelope-wrapper { 
    margin-top: -25px;
    margin-bottom: 0;
  }

  .envelope-hint { 
    margin-top: -30px;
    margin-bottom: 0;
  }

  .letter-open-decoration img { max-width: 300px; }
}
</style>
</head>

function toFa(num) {
  const digits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(num).replace(/\d/g, d => digits[d]);
}

function fixPersian(text) {
  if (!text) return "";
  return String(text).replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/ة/g, "ه");
}

function openEnvelope() {
  const wrapper = document.getElementById("envelopeWrapper");
  if (wrapper.classList.contains("opening")) return;
  
  wrapper.classList.add("opening");
  
  const hint = document.getElementById("envelopeHint");
  if (hint) hint.style.opacity = "0";
  
  setTimeout(() => {
    document.getElementById("envelope-screen").classList.remove("active");
    document.getElementById("winners-screen").classList.add("active");
    window.scrollTo(0, 0);
    loadWinners();
  }, 1500);
}

function loadWinners() {
  const tbody = document.getElementById("winners-tbody");
  
  try {
    const winners = [...WINNERS_DATA];
    winners.sort((a, b) => a.rank - b.rank);
    
    document.getElementById("total-count").textContent = toFa(winners.length);
    
    tbody.innerHTML = "";
    
    winners.forEach((winner, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="col-rank">${toFa(winner.rank)}</td>
        <td class="col-name">${fixPersian(winner.name)}</td>
        <td class="col-code">${toFa(winner.code)}</td>
        <td class="col-branch">${fixPersian(winner.branch)}</td>
      `;
      tbody.appendChild(tr);
      
      setTimeout(() => {
        tr.classList.add("revealed");
      }, 100 + i * 40);
    });
  } catch (err) {
    console.error("خطا:", err);
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;">خطا در بارگذاری داده‌ها</td></tr>`;
  }
}

function goBack() {
  document.getElementById("winners-screen").classList.remove("active");
  document.getElementById("envelope-screen").classList.add("active");
  
  const wrapper = document.getElementById("envelopeWrapper");
  wrapper.classList.remove("opening");
  
  const hint = document.getElementById("envelopeHint");
  if (hint) hint.style.opacity = "1";
  
  document.getElementById("winners-tbody").innerHTML = "";
}

document.addEventListener("keydown", (e) => {
  if (document.getElementById("winners-screen").classList.contains("active")) {
    if (e.key === "Escape") goBack();
  } else if (document.getElementById("envelope-screen").classList.contains("active")) {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      openEnvelope();
    }
  }
});
</script>
